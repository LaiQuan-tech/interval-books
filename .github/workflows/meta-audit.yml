name: Meta Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-meta:
    name: Verify zh/en/ja meta tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run meta audit
        id: audit
        run: bun run check:meta

      - name: Upload audit report
        # Always upload — useful on success for tracking, critical on failure for triage.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-audit-report
          path: reports/meta-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize report in job output
        if: always()
        run: |
          if [ -f reports/meta-audit.json ]; then
            echo "## Meta Audit Report" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            jq '.summary' reports/meta-audit.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            FAILED=$(jq '.summary.totalIssues' reports/meta-audit.json)
            if [ "$FAILED" != "0" ]; then
              echo "### Findings" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              jq '.findings' reports/meta-audit.json >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
