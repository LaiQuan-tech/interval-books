name: Meta Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-meta:
    name: Verify zh/en/ja meta tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # npm, not bun: Vercel builds this project with `npm run build`, so
      # package-lock.json is the lockfile that actually gets maintained.
      # Keeping bun here meant bun.lockb silently drifted whenever a dependency
      # was added, and `--frozen-lockfile` then failed the whole workflow before
      # the audit ever ran.
      # Node 24 ships npm 11, matching the npm that generated package-lock.json.
      # npm 10 (bundled with Node 22) resolves this lockfile differently and
      # reports platform-specific packages as missing even though they are present.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run meta audit
        id: audit
        # Capture exit code so the summary still runs on failure; we re-fail at the end.
        run: |
          set +e
          npm run check:meta
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-audit-report
          path: reports/meta-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Write job summary
        if: always()
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          # Use head SHA on PRs so links point at the contributor's commit, not the merge commit.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO_NAME: ${{ github.event.repository.name }}
          # Optional: pin a single absolute path for vscode://file/ links.
          # If unset, the summary emits multiple candidate vscode:// links built
          # from common clone locations — only the one that exists on your
          # machine will succeed when clicked.
          LOCAL_WORKSPACE_ROOT: ${{ vars.LOCAL_WORKSPACE_ROOT }}
          # Optional: extra candidate roots, newline- or comma-separated.
          # e.g. "/Volumes/Work/repos\n/Users/me/clients"
          LOCAL_WORKSPACE_CANDIDATES: ${{ vars.LOCAL_WORKSPACE_CANDIDATES }}
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          if [ ! -f reports/meta-audit.json ]; then
            echo "## ❌ Meta Audit — report not generated" >> "$SUMMARY"
            echo "The audit script crashed before writing \`reports/meta-audit.json\`." >> "$SUMMARY"
            exit 0
          fi

          TOTAL=$(jq -r '.summary.totalIssues' reports/meta-audit.json)
          PASSED=$(jq -r '.summary.passed' reports/meta-audit.json)
          ROUTES=$(jq -r '.summary.routesAudited' reports/meta-audit.json)
          BLOB="$REPO_URL/blob/$SHA"
          DEV="${REPO_URL/github.com/github.dev}/blob/$SHA"

          # ---------- Build candidate workspace roots ----------
          # If the user pinned LOCAL_WORKSPACE_ROOT, use it as the single root.
          # Otherwise, generate likely roots from REPO_NAME × common parents.
          ROOTS_JSON=""
          if [ -n "$LOCAL_WORKSPACE_ROOT" ]; then
            ROOTS_JSON=$(jq -cn --arg r "${LOCAL_WORKSPACE_ROOT%/}" '[$r]')
          else
            # Common parent directories where developers clone repos.
            # ~ is left literal — vscode:// resolves it on macOS/Linux when the
            # OS forwards the URL through the shell; for safety we also emit
            # /Users/$USER and /home/$USER style guesses below at runtime.
            PARENTS=(
              "~/code" "~/Code" "~/dev" "~/Dev" "~/Developer"
              "~/projects" "~/Projects" "~/repos" "~/Repos"
              "~/work" "~/Work" "~/src" "~/git" "~/github"
              "~/Documents/code" "~/Documents/projects" "~/Documents/GitHub"
              "~"
              # Windows (Git Bash / WSL style — vscode:// accepts forward slashes)
              "/c/Users/$USER/code" "/c/Users/$USER/source/repos"
              "C:/Users/$USER/code" "C:/Users/$USER/source/repos"
            )
            # Build JSON array of "<parent>/<repo>"
            CANDIDATES=()
            for p in "${PARENTS[@]}"; do
              CANDIDATES+=("${p%/}/$REPO_NAME")
            done
            # Append any user-supplied extra candidates (split on newline or comma)
            if [ -n "$LOCAL_WORKSPACE_CANDIDATES" ]; then
              while IFS= read -r line; do
                [ -n "$line" ] && CANDIDATES+=("${line%/}/$REPO_NAME")
              done < <(printf '%s' "$LOCAL_WORKSPACE_CANDIDATES" | tr ',' '\n')
            fi
            ROOTS_JSON=$(printf '%s\n' "${CANDIDATES[@]}" | jq -R . | jq -s .)
          fi

          ROOT_COUNT=$(echo "$ROOTS_JSON" | jq 'length')

          if [ "$PASSED" = "true" ]; then
            echo "## ✅ Meta Audit passed" >> "$SUMMARY"
            echo "- Routes audited: **$ROUTES**" >> "$SUMMARY"
            echo "- Languages: zh / en / ja" >> "$SUMMARY"
            echo "- Issues: **0**" >> "$SUMMARY"
          else
            echo "## ❌ Meta Audit failed — $TOTAL issue(s)" >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            if [ -n "$LOCAL_WORKSPACE_ROOT" ]; then
              echo "_Open links: 🌐 GitHub · 🖥️ github.dev · 💻 vscode (local: \`$LOCAL_WORKSPACE_ROOT\`)_" >> "$SUMMARY"
            else
              echo "_Open links: 🌐 GitHub · 🖥️ github.dev · 💻¹…💻ⁿ vscode (trying $ROOT_COUNT common clone locations — only the one that exists on your machine will open). Pin one path via repo variable \`LOCAL_WORKSPACE_ROOT\`._" >> "$SUMMARY"
            fi
            echo "" >> "$SUMMARY"
            echo "### Counts by language" >> "$SUMMARY"
            echo '| Language | Issues |' >> "$SUMMARY"
            echo '|----------|--------|' >> "$SUMMARY"
            jq -r '.summary.issuesByLanguage | to_entries[] | "| \(.key) | \(.value) |"' reports/meta-audit.json >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            echo "### Counts by code" >> "$SUMMARY"
            echo '| Code | Issues |' >> "$SUMMARY"
            echo '|------|--------|' >> "$SUMMARY"
            jq -r '.summary.issuesByCode | to_entries[] | "| `\(.key)` | \(.value) |"' reports/meta-audit.json >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            echo "### Failing routes" >> "$SUMMARY"
            echo '| Route | File | First issue | Open | Issues |' >> "$SUMMARY"
            echo '|-------|------|-------------|------|--------|' >> "$SUMMARY"
            jq -r --arg blob "$BLOB" --arg dev "$DEV" --argjson roots "$ROOTS_JSON" '
              def vscode_links($file; $line):
                if ($roots | length) == 1
                  then ["[💻](vscode://file/\($roots[0])/\($file):\($line))"]
                  else [ range(0; $roots | length) as $i
                         | "[💻\($i+1)](vscode://file/\($roots[$i])/\($file):\($line))" ]
                end;
              .routes
              | to_entries[]
              | select(.value.ok == false)
              | . as $r
              | ($r.value.issues[0].line // null) as $ln
              | ($r.value.file) as $f
              | ($ln // 1) as $L
              | ([ "[🌐](\($blob)/\($f)#L\($L))",
                   "[🖥️](\($dev)/\($f)#L\($L))" ]
                 + vscode_links($f; $L)
                 | join(" ")) as $links
              | "| \($r.key) | [`\($f)`](\($blob)/\($f)) | " +
                (if $ln then "L\($ln)" else "—" end) +
                " | \($links) | \($r.value.issues | length) |"
            ' reports/meta-audit.json >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            echo "### Findings" >> "$SUMMARY"
            echo '| Location | Open | Lang | Field | Code | Message |' >> "$SUMMARY"
            echo '|----------|------|------|-------|------|---------|' >> "$SUMMARY"
            jq -r --arg blob "$BLOB" --arg dev "$DEV" --argjson roots "$ROOTS_JSON" '
              def vscode_links($file; $line):
                if ($roots | length) == 1
                  then ["[💻](vscode://file/\($roots[0])/\($file):\($line))"]
                  else [ range(0; $roots | length) as $i
                         | "[💻\($i+1)](vscode://file/\($roots[$i])/\($file):\($line))" ]
                end;
              .findings[]
              | . as $f
              | ($f.line // null) as $ln
              | ($ln // 1) as $L
              | (if $ln then "`\($f.file):\($ln)`" else "`\($f.file)`" end) as $loc
              | ([ "[🌐](\($blob)/\($f.file)#L\($L))",
                   "[🖥️](\($dev)/\($f.file)#L\($L))" ]
                 + vscode_links($f.file; $L)
                 | join(" ")) as $links
              | "| \($loc) | \($links) | \($f.lang // "-") | \($f.field // "-") | `\($f.code)` | \($f.message | gsub("\\|"; "\\|")) |"
            ' reports/meta-audit.json >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            if [ -z "$LOCAL_WORKSPACE_ROOT" ]; then
              echo "<details><summary>vscode candidate roots tried (in order)</summary>" >> "$SUMMARY"
              echo "" >> "$SUMMARY"
              echo "$ROOTS_JSON" | jq -r '.[] | "- `" + . + "`"' >> "$SUMMARY"
              echo "" >> "$SUMMARY"
              echo "</details>" >> "$SUMMARY"
              echo "" >> "$SUMMARY"
            fi
            echo "📎 Full JSON report attached as **meta-audit-report** artifact." >> "$SUMMARY"
          fi

      - name: Enforce audit result
        if: always()
        run: |
          CODE="${{ steps.audit.outputs.exit_code }}"
          # An empty CODE means the audit step never ran — an earlier step (e.g.
          # dependency install) failed. Say so plainly instead of reporting
          # "failed with exit code " and sending the reader hunting through the
          # audit findings for a problem that isn't there.
          if [ -z "$CODE" ]; then
            echo "::error::Meta audit did not run — an earlier step failed. Check the Install dependencies step."
            exit 1
          fi
          if [ "$CODE" != "0" ]; then
            echo "::error::Meta audit failed with exit code $CODE — see Job Summary and meta-audit-report artifact."
            exit 1
          fi
